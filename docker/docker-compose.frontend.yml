version: "3"
services:
  frontend-course:
    image: registry.cn-hangzhou.aliyuncs.com/elite_study/frontend:latest
    restart: always
    container_name: frontend-course
    ports:
      - 3000:3000
    networks:
      - elite_study_nginx_network # 将前端服务连接到 elite_study_nginx_network
networks:
  elite_study_nginx_network:
    external: true
